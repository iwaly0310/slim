<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Noto Sans TC, PingFang TC, sans-serif">
  <defs>
    <clipPath id="c"><circle cx="220" cy="200" r="150"/></clipPath>
  </defs>
  <!-- plate -->
  <circle cx="220" cy="200" r="170" fill="#fffdf8" stroke="#e6dccb" stroke-width="4"/>
  <g clip-path="url(#c)">
    <rect x="70" y="50" width="150" height="300" fill="#7fb77e"/>
    <rect x="220" y="50" width="150" height="150" fill="#ee8a4b"/>
    <rect x="220" y="200" width="150" height="150" fill="#f5c542"/>
  </g>
  <circle cx="220" cy="200" r="150" fill="none" stroke="#fffdf8" stroke-width="6"/>
  <line x1="220" y1="50" x2="220" y2="350" stroke="#fffdf8" stroke-width="6"/>
  <line x1="220" y1="200" x2="370" y2="200" stroke="#fffdf8" stroke-width="6"/>
  <!-- labels on plate -->
  <text x="145" y="190" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">蔬菜</text>
  <text x="145" y="228" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">1/2</text>
  <text x="295" y="120" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">蛋白質</text>
  <text x="295" y="152" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">1/4</text>
  <text x="295" y="270" text-anchor="middle" font-size="28" font-weight="700" fill="#5a3d00">主食</text>
  <text x="295" y="302" text-anchor="middle" font-size="20" font-weight="700" fill="#5a3d00">1/4</text>
  <!-- water glass -->
  <path d="M436 120 L452 220 L494 220 L510 120 Z" fill="#dfeaf8" stroke="#23407a" stroke-width="4" stroke-linejoin="round"/>
  <rect x="446" y="160" width="54" height="56" fill="#9cc3ea" clip-path="none" opacity=".8"/>
  <text x="473" y="252" text-anchor="middle" font-size="18" fill="#243046">白開水／無糖茶</text>
  <!-- order -->
  <text x="410" y="300" font-size="20" font-weight="700" fill="#182d5c">吃的順序</text>
  <g font-size="19" fill="#243046">
    <circle cx="422" cy="330" r="12" fill="#ee8a4b"/><text x="422" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">1</text>
    <text x="442" y="336">蛋白質先吃</text>
    <circle cx="422" cy="362" r="12" fill="#7fb77e"/><text x="422" y="368" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">2</text>
    <text x="442" y="368">再吃蔬菜</text>
    <circle cx="540" cy="362" r="12" fill="#f5c542"/><text x="540" y="368" text-anchor="middle" font-size="15" font-weight="700" fill="#5a3d00">3</text>
    <text x="560" y="368">最後主食</text>
  </g>
  <text x="220" y="385" text-anchor="middle" font-size="16" fill="#55607a">一半蔬菜、一格蛋白質、一格主食</text>
</svg>
